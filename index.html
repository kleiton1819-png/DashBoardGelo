 <div class="top">

</div></div>
<script>

 rows.forEach(function(r){var k=hk(r.d),p=P[r.m]||(P[r.m]={m:r.m,nome:r.n,h:{},t:0});p.h[k]=(p.h[k]||0)+r.q;p.t+=r.q});

 var pf=cfg.pf.toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
 rows.forEach(function(r){if(r.a===1&&r.c&&isC(r.e,pf))SK.f[r.c]=1});

 var m=M[p],g=p===1?cfg.g1:cfg.g2,rows=m.rows,tot=rows.reduce(function(a,r){return a+r.t},0);

 document.getElementById("s"+p).textContent="Meta de "+g+" caixas por hora";
 var ks=G.ks.slice(-10),pad=0,min=G.last.getMinutes(),L=document.getElementById("l"+p),i;
 var cg='<colgroup><col style="width:2.6em"><col class="mt" style="width:5.6em"><col><col style="width:4em">'+('<col style="width:'+(ks.length>6?2.5:3.6)+'em">').repeat(ks.length)+'</colgroup>';

 function tr(r,n){
